[package]
name = "ucalg-baja-cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
actix-cors = "0.7.1"
tokio = { version = "1.50.0", features = ["sync", "macros"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde-saphyr = {version = "0.0.22", features = ["garde", "miette"]}
uuid = { version = "1.22.0", features = ["v4"] }
umya-spreadsheet = "2.3.3"
darkicewolf50-actix-setup = { version = "0.3.3", registry = "darkicewolf50-forge", features = [
    "full",
] }
utoipa = { version = "5.4.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "reqwest"] }
utoipa-actix-web = "0.1.2"


[profile.release]
debug = false
lto = "fat"
codegen-units = 1
split-debuginfo = "off"
panic = "abort"
opt-level = 3
