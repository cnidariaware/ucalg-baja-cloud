# name of the workflow.
# this is optional.
name: Build Container & Upload

# events that will trigger this workflow.
# here, we only have "pull_request", so the workflow will run
# whenever we create a pull request.
# other examples: [push] and [pull_request, push]
on:
  # pull_request:

  push:
    branches:
      - master

env:
  FORGEJO_REGISTRY: forge.ucalgarybaja.ca

# each workflow must have at least one job.
# jobs run in parallel by default (we can change that).
# each job groups together a series of steps to accomplish a purpose.
jobs:
  deploy:
    runs-on: ubuntu-*
    # if: ${{ github.ref == 'refs/heads/master' || github.event.pull_request.merged == true }} # Runs if it's a push to 'main' or a merged PR to 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Rust setup
        uses: https://github.com/dtolnay/rust-toolchain@stable

      # log into docker hub
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Using secret for Docker username
          password: ${{ secrets.DOCKER_PASSWORD }} # Using secret for Docker password
        id: docker-login

      # Login to Forgejo registry
      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.FORGEJO_REGISTRY }}
          username: ${{ secrets.FORGEJO_ACTOR }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        id: forgejo-login

      - name: build container image # build the container
        run: docker compose build --no-cache
        id: docker-build

      - name: Upload to Dockerhub
        run: docker push darkicewolf50/ucalg-baja-cloud:latest
        if: ${{ steps.docker-login.outcome == 'success' && steps.docker-build.outcome == 'success' }}

      - name: Upload to Dockerhub with Git SHA tag
        run: |
          docker tag darkicewolf50/ucalg-baja-cloud:latest darkicewolf50/darkicewolf50cloud:${{ github.sha }}
          docker push darkicewolf50/darkicewolf50cloud:${{ github.sha }}
        if: ${{ steps.docker-login.outcome == 'success' && steps.docker-build.outcome == 'success' }}

      - name: Upload to Forgejo with Git SHA tag
        run: |
          docker tag darkicewolf50/ucalg-baja-cloud:latest forge.ucalgarybaja.ca/ucalgary-baja/ucalg-baja-cloud:${{ github.sha }}
          docker push forge.ucalgarybaja.ca/ucalgary-baja/ucalg-baja-cloud:${{ github.sha }}
        if: ${{ steps.forgejo-login.outcome == 'success' && steps.docker-build.outcome == 'success' }}

      - name: Upload to Forgejo
        run: |
          docker tag darkicewolf50/ucalg-baja-cloud:latest forge.ucalgarybaja.ca/ucalgary-baja/ucalg-baja-cloud:latest
          docker push forge.ucalgarybaja.ca/ucalgary-baja/ucalg-baja-cloud:latest
        if: ${{ steps.forgejo-login.outcome == 'success' && steps.docker-build.outcome == 'success' }}

      - name: Aggressive Docker cleanup
        if: always()
        run: |
          echo "Pruning unused local images, containers, and build cache..."

          # Remove local tags created during this specific run to save space
          docker rmi darkicewolf50/ucalg-baja-cloud:latest || true
          docker rmi darkicewolf50/ucalg-baja-cloud:${{ github.sha }} || true
          docker rmi ${{ env.FORGEJO_REGISTRY }}/ucalgary-baja/ucalg-baja-cloud:${{ github.sha }} || true
          docker rmi ${{ env.FORGEJO_REGISTRY }}/ucalgary-baja/ucalg-baja-cloud:latest || true

          # Force purge dangling volumes, build cache, and dead networks
          docker system prune -af --volumes
          docker builder prune -af
